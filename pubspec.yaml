name: micro_opportunites
description: "MicroOpportunités — missions rémunérées près de chez soi."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2
  go_router: ^17.5.0
  flutter_svg: ^2.3.0
  freezed_annotation: ^3.1.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  url_launcher: ^6.3.2
  image_picker: ^1.2.3
  json_annotation: ^4.11.0
  country_picker: ^2.0.28
  intl: ^0.20.2
  supabase_flutter: ^2.18.0
  geolocator: ^14.1.1
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  riverpod_generator: ^4.0.3
  freezed: ^3.2.5
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  json_serializable: ^6.13.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/logo/
    - assets/images/illustrations/
    - assets/fonts/licenses/
  fonts:
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora-Regular.ttf
          weight: 400
        - asset: assets/fonts/Lora-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Lora-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_icon.png
  remove_alpha_ios: true
  adaptive_icon_background: "#1F6B4F"
  adaptive_icon_foreground: assets/branding/app_icon_foreground.png
  adaptive_icon_monochrome: assets/branding/app_icon_monochrome.png

flutter_native_splash:
  color: "#1F6B4F"
  image: assets/branding/splash_logo.png
  android_12:
    color: "#1F6B4F"
    image: assets/branding/splash_logo_android12.png
    icon_background_color: "#1F6B4F"
  android: true
  ios: true
  web: false
  ios_content_mode: center
